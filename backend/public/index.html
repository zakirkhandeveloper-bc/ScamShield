<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamShield Playground</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d23; --muted: #646b78; --border: #dfe2e7;
    --accent: #3b5bdb; --safe: #2b8a3e; --safe-bg: #ebfbee; --warn: #b8860b; --warn-bg: #fff9db;
    --danger: #c92a2a; --danger-bg: #fff0f0; --code-bg: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1a1d24; --text: #e9ecef; --muted: #9aa1ad; --border: #2c313b;
      --accent: #748ffc; --safe: #69db7c; --safe-bg: #15261a; --warn: #ffd43b; --warn-bg: #2a2512;
      --danger: #ff8787; --danger-bg: #2d1616; --code-bg: #22262e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .preset { text-align: left; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 12px; cursor: pointer; font: inherit; }
  .preset:hover { border-color: var(--accent); }
  .preset b { display: block; font-size: 14px; }
  .preset span { font-size: 12.5px; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: 13px ui-monospace, Consolas, monospace; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  textarea { min-height: 70px; resize: vertical; word-break: break-all; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  .inline { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; }
  .inline input { width: auto; }
  .btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button.main { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; }
  #result { display: none; }
  .verdict { border-radius: 12px; padding: 18px; border: 2px solid; }
  .verdict.SAFE { background: var(--safe-bg); border-color: var(--safe); }
  .verdict.WARNING { background: var(--warn-bg); border-color: var(--warn); }
  .verdict.DANGER { background: var(--danger-bg); border-color: var(--danger); }
  .level { font-size: 26px; font-weight: 800; }
  .SAFE .level { color: var(--safe); } .WARNING .level { color: var(--warn); } .DANGER .level { color: var(--danger); }
  .summary { font-size: 17px; margin: 6px 0 12px; }
  .finding { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
  .sev { font: 700 11px system-ui; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; height: fit-content; white-space: nowrap; border: 1px solid currentColor; }
  .sev.high { color: var(--danger); } .sev.medium { color: var(--warn); } .sev.low, .sev.info { color: var(--muted); }
  details { margin-top: 12px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre { background: var(--code-bg); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }
  .err { color: var(--danger); }
  .anatomy { font: 12.5px ui-monospace, Consolas, monospace; word-break: break-all; margin-top: 8px; line-height: 1.8; }
  .anatomy .sel { background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 3px; }
  .anatomy .a1 { background: var(--warn-bg); outline: 1px solid var(--warn); border-radius: 4px; }
  .anatomy .a2 { background: var(--danger-bg); outline: 1px solid var(--danger); border-radius: 4px; }
  .legend { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>🛡️ ScamShield Playground</h1>
  <p class="sub">Transaction ko sign karne se <b>pehle</b> check karo. Ek misaal chuno, ya khud banao, phir "Check karo" dabao.</p>

  <section class="card">
    <h2>1. Tayyar misaalen</h2>
    <div class="presets" id="presets"></div>
  </section>

  <section class="card">
    <h2>2. Khud transaction banao</h2>
    <div class="row">
      <div>
        <label for="action">Kya karna hai?</label>
        <select id="action">
          <option value="approve">approve: kisi ko chaabi do (tokens)</option>
          <option value="transfer">transfer: tokens bhejo</option>
          <option value="setApprovalForAll">setApprovalForAll: saare NFTs ki chaabi</option>
          <option value="claim">claim(): FakeAirdrop ka anjaan function</option>
        </select>
      </div>
      <div>
        <label for="target">Kisko? (spender / receiver)</label>
        <select id="target"></select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="amount">Kitna? (tUSDC)</label>
        <input id="amount" type="number" min="0" step="any" value="50">
      </div>
      <div class="inline" style="margin-top:30px">
        <input id="unlimited" type="checkbox"> <label for="unlimited" style="margin:0">UNLIMITED (sab tokens)</label>
      </div>
    </div>
    <div class="btns"><button class="ghost" id="build">⬇ Transaction banao</button></div>
  </section>

  <section class="card">
    <h2>3. Transaction (jo wallet ko jata hai)</h2>
    <div class="row">
      <div><label for="from">from (aap)</label><input id="from"></div>
      <div><label for="to">to (contract jisko call ho raha hai)</label><input id="to"></div>
    </div>
    <label for="data">data (asal hukam, hex)</label>
    <textarea id="data" spellcheck="false"></textarea>
    <div id="anatomy" class="anatomy"></div>
    <div class="btns"><button class="main" id="check">🔍 Check karo</button></div>
  </section>

  <section id="result">
    <div class="verdict" id="verdict">
      <div class="level" id="level"></div>
      <div class="summary" id="summaryText"></div>
      <div id="findings"></div>
      <details><summary>Decoded details (developer ke liye)</summary><pre id="raw"></pre></details>
    </div>
  </section>
</main>

<script>
  // Anvil ke addresses (contracts/README ya pichle steps se)
  const A = {
    usdc:    "0x5FbDB2315678afecb367f032d93F642f64180aa3",
    airdrop: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512",
    ali:     "0x70997970C51812dc3A010C7d01b50e0d17dc79C8",
    chor:    "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266",
    bob:     "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC",
  };
  const TARGETS = [
    ["airdrop", "FakeAirdrop (drainer contract)"],
    ["bob", "Bob (aam wallet)"],
    ["chor", "Chor (aam wallet)"],
    ["usdc", "TestUSDC (token contract)"],
  ];
  const SEL = { approve: "095ea7b3", transfer: "a9059cbb", setApprovalForAll: "a22cb465", claim: "4e71d92d" };
  const MAX = (1n << 256n) - 1n;

  const $ = (id) => document.getElementById(id);
  const pad = (hex) => hex.replace(/^0x/, "").toLowerCase().padStart(64, "0");
  const encAddr = (a) => pad(a);
  const encUint = (n) => pad(BigInt(n).toString(16));

  function encode(action, target, amountUnits, unlimited) {
    if (action === "claim") return "0x" + SEL.claim;
    if (action === "setApprovalForAll") return "0x" + SEL.setApprovalForAll + encAddr(target) + encUint(1);
    const amt = unlimited ? MAX : amountUnits;
    return "0x" + SEL[action] + encAddr(target) + encUint(amt);
  }

  const PRESETS = [
    { t: "🎁 'Enable Claiming' (drainer)", d: "Chor ke contract ko UNLIMITED chaabi", action: "approve", target: "airdrop", unlimited: true },
    { t: "👤 Aam wallet ko 50 tUSDC", d: "Approve kisi insaan ke wallet ko", action: "approve", target: "bob", amount: 50 },
    { t: "✅ Revoke", d: "Drainer se chaabi wapas lena (approve 0)", action: "approve", target: "airdrop", amount: 0 },
    { t: "💸 Bob ko 10 tUSDC bhejo", d: "Seedha transfer", action: "transfer", target: "bob", amount: 10 },
    { t: "🖼️ Saare NFTs ki chaabi", d: "setApprovalForAll(chor, true)", action: "setApprovalForAll", target: "chor" },
    { t: "❓ claim() (anjaan function)", d: "Bahar se masoom, andar kya hai pata nahi", action: "claim", target: "airdrop" },
  ];

  $("target").innerHTML = TARGETS.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");

  function fill({ action, target, amount = 0, unlimited = false }) {
    $("action").value = action; $("target").value = target;
    $("amount").value = amount; $("unlimited").checked = unlimited;
    build();
  }

  function build() {
    const action = $("action").value;
    const target = A[$("target").value];
    const units = BigInt(Math.round(Number($("amount").value || 0) * 1e6)); // 6 decimals
    $("from").value = A.ali;
    $("to").value = action === "claim" ? A.airdrop : A.usdc;
    $("data").value = encode(action, target, units, $("unlimited").checked);
    showAnatomy();
  }

  // data ko rangon mein tod ke dikhana: selector | param 1 | param 2
  function showAnatomy() {
    const d = $("data").value.trim().replace(/^0x/, "");
    if (!d) { $("anatomy").innerHTML = ""; return; }
    const sel = d.slice(0, 8), p1 = d.slice(8, 72), p2 = d.slice(72, 136), rest = d.slice(136);
    const esc = (s) => s.replace(/[^0-9a-fA-F]/g, "");
    $("anatomy").innerHTML =
      `0x<span class="sel">${esc(sel)}</span>` +
      (p1 ? `<span class="a1">${esc(p1)}</span>` : "") +
      (p2 ? `<span class="a2">${esc(p2)}</span>` : "") + esc(rest) +
      `<div class="legend"><span class="sel">&nbsp;</span> function (kya) &nbsp; <span class="a1">&nbsp;&nbsp;</span> kisko &nbsp; <span class="a2">&nbsp;&nbsp;</span> kitna / haan-na</div>`;
  }

  $("presets").innerHTML = PRESETS.map((p, i) => `<button class="preset" data-i="${i}"><b>${p.t}</b><span>${p.d}</span></button>`).join("");
  $("presets").addEventListener("click", (e) => {
    const b = e.target.closest(".preset"); if (!b) return;
    fill(PRESETS[b.dataset.i]); check();
  });
  $("build").addEventListener("click", build);
  $("data").addEventListener("input", showAnatomy);
  $("check").addEventListener("click", check);

  async function check() {
    const body = { from: $("from").value.trim(), to: $("to").value.trim(), data: $("data").value.trim() };
    $("result").style.display = "block";
    const v = $("verdict");
    try {
      const res = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const r = await res.json();
      if (!res.ok) throw new Error(r.error || res.statusText);
      const icon = { SAFE: "🟢", WARNING: "🟡", DANGER: "🔴" }[r.level];
      v.className = "verdict " + r.level;
      $("level").textContent = `${icon} ${r.level}`;
      $("summaryText").textContent = r.summary;
      $("findings").replaceChildren(...r.findings.map((f) => {
        const row = document.createElement("div"); row.className = "finding";
        const s = document.createElement("span"); s.className = "sev " + f.severity; s.textContent = f.severity;
        const m = document.createElement("span"); m.textContent = f.message; // textContent: XSS se bachao
        row.append(s, m); return row;
      }));
      $("raw").textContent = JSON.stringify(r.decoded, null, 2);
    } catch (err) {
      v.className = "verdict WARNING";
      $("level").textContent = "⚠️ Error";
      $("summaryText").innerHTML = `<span class="err"></span>`;
      $("summaryText").firstChild.textContent = err.message + " (kya Anvil aur backend chal rahe hain?)";
      $("findings").replaceChildren(); $("raw").textContent = "";
    }
    $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  fill(PRESETS[0]);
</script>
</body>
</html>
